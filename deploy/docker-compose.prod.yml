services:
  itqan-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: itqan_quran_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-25060}
      - DB_USER=${DB_USER:-doadmin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-defaultdb}
      - DB_SSL=${DB_SSL:-true}
      - DB_SCHEMA=${DB_SCHEMA:-itqan}
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
