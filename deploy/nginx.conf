# =========================================================================
# Nginx Configuration for: itqan.katatibi.com
# DigitalOcean Droplet + Cloudflare Proxy Support
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name itqan.katatibi.com;

    # Redirect HTTP to HTTPS (Cloudflare Full SSL Mode)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itqan.katatibi.com;

    # SSL Certificates (if terminating SSL locally or Cloudflare Origin Cert)
    # ssl_certificate /etc/letsencrypt/live/itqan.katatibi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/itqan.katatibi.com/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Reverse Proxy to Itqan Docker Container on Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Cloudflare & Client Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
